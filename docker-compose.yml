services:
  mongo:
    image: mongo:8.0
    container_name: node-it-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - node-it

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: node-it-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      - PORT=8080
      - MONGODB_URI=mongodb://mongo:27017/node_it
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    networks:
      - node-it

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: node-it-frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    networks:
      - node-it

  # Phase 2.5 Next.js scaffold. Runs alongside the Vite frontend until parity
  # is reached, then frontend + backend get retired and Caddy points here.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: node-it-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - BACKEND_URL=http://backend:8080
    ports:
      - "3001:3000"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    networks:
      - node-it

  caddy:
    image: caddy:2-alpine
    container_name: node-it-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - node-it

networks:
  node-it:
    driver: bridge

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
  web_node_modules:
  caddy_data:
  caddy_config:
